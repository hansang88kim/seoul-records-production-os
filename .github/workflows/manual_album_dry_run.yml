name: Manual Album Dry Run

on:
  workflow_dispatch:
    inputs:
      track_count:
        description: "Number of tracks to generate"
        required: true
        default: "3"
        type: choice
        options: ["1", "3", "5", "10", "15", "20"]
      preset:
        description: "Language pack"
        required: true
        default: "ko_kr_seoul"
        type: choice
        options: ["ko_kr_seoul"]
      theme:
        description: "Theme"
        required: false
        default: "Late Night Drive"

jobs:
  dry-run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run mock album dry run
        env:
          COMPOSER_PROVIDER: mock
          DRY_RUN_TRACK_COUNT: ${{ inputs.track_count }}
          DRY_RUN_PRESET: ${{ inputs.preset }}
          DRY_RUN_THEME: ${{ inputs.theme }}
        run: python -m scripts.ci_album_dry_run
